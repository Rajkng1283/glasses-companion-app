name: Build & Publish Signed Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PASS:-GlassesCompanion2026!}" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS:-glasses_companion_release}" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=${KEY_PASS:-GlassesCompanion2026!}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks"               -alias glasses_companion_release -keyalg RSA -keysize 2048 -validity 10000               -storepass "GlassesCompanion2026!" -keypass "GlassesCompanion2026!"               -dname "CN=Glasses Companion, OU=Mobile, O=GlassesCompanion, L=Tampa, S=FL, C=US"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "RELEASE_KEYSTORE_PASSWORD=GlassesCompanion2026!" >> $GITHUB_ENV
            echo "RELEASE_KEY_ALIAS=glasses_companion_release" >> $GITHUB_ENV
            echo "RELEASE_KEY_PASSWORD=GlassesCompanion2026!" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests & Build Signed Release APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2560m"

      - name: Verify APK Signature & Print SHA-256 Hashes
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" glasses-companion-v1.0.0.apk
          echo "=== APK SHA-256 ==="
          sha256sum glasses-companion-v1.0.0.apk
          echo "=== CERTIFICATE SHA-256 ==="
          keytool -list -v -keystore "$RELEASE_KEYSTORE_FILE" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | grep -i "SHA256:"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: glasses-companion-v1.0.0-apk
          path: glasses-companion-v1.0.0.apk

      - name: Publish Signed APK to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 glasses-companion-v1.0.0.apk             --title "Glasses Companion v1.0.0 (Signed Release APK)"             --notes "Signed Android Release APK for Glasses Companion."             --clobber
